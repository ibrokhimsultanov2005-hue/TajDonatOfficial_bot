<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TajDonat Official Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #f59e0b;
            --green: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text); padding: 16px; padding-bottom: 40px; }
        .bank-card { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35); margin-bottom: 24px; position: relative; overflow: hidden; }
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; opacity: 0.9; }
        .card-chip { width: 34px; height: 24px; background: #f59e0b; border-radius: 5px; }
        .card-balance { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
        .card-number { font-family: monospace; font-size: 15px; letter-spacing: 2px; opacity: 0.9; display: flex; justify-content: space-between; align-items: center; }
        .card-actions { margin-top: 15px; display: flex; gap: 10px; }
        .btn-topup { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.3); color: white; padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
        .game-card { background: var(--card-bg); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; align-items: center; border: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; }
        .game-icon { width: 55px; height: 55px; border-radius: 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 26px; color: white; }
        .game-title { font-weight: 700; font-size: 14px; margin-bottom: 3px; text-align: center; }
        .game-sub { font-size: 11px; color: var(--text-muted); text-align: center; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(10px); z-index: 100; padding: 20px; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-close { background: var(--card-bg); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .packages-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .pkg-item { background: var(--card-bg); border: 2px solid transparent; border-radius: 14px; padding: 12px; text-align: center; cursor: pointer; }
        .pkg-item.selected { border-color: var(--accent); background: rgba(99, 102, 241, 0.15); }
        .pkg-amount { font-size: 15px; font-weight: 800; color: var(--gold); margin-bottom: 4px; }
        .pkg-price { font-size: 13px; font-weight: 600; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
        .form-input { width: 100%; background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 12px 14px; color: white; font-size: 14px; outline: none; }
        .promo-box { display: flex; gap: 8px; }
        .btn-promo { background: var(--card-bg); border: 1px solid var(--accent); color: var(--accent); padding: 0 16px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .btn-primary { width: 100%; background: var(--accent); color: white; border: none; border-radius: 14px; padding: 14px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="bank-card">
        <div class="card-top">
            <span class="card-title"><i class="fa-solid fa-bolt"></i> TajDonat Card</span>
            <div class="card-chip"></div>
        </div>
        <div class="card-balance" id="userBalance">200.00 TJS</div>
        <div class="card-number">
            <span id="cardNumber">8888 •••• •••• 1001</span>
            <i class="fa-solid fa-copy" onclick="copyCard()" style="cursor:pointer; font-size:14px;"></i>
        </div>
        <div class="card-actions">
            <button class="btn-topup" onclick="showTopup()"><i class="fa-solid fa-plus"></i> Пополнить баланс</button>
        </div>
    </div>

    <div class="section-title"><i class="fa-solid fa-gamepad" style="color:var(--accent)"></i> Выберите игру</div>
    <div class="games-grid">
        <div class="game-card" onclick="openGame('freefire')">
            <div class="game-icon" style="background: linear-gradient(135deg, #ff416c, #ff4b2b);">🔥</div>
            <div class="game-title">Free Fire</div>
            <div class="game-sub">Алмазы / Ваучеры</div>
        </div>
        <div class="game-card" onclick="openGame('pubg')">
            <div class="game-icon" style="background: linear-gradient(135deg, #f7971e, #ffd200);">🔫</div>
            <div class="game-title">PUBG Mobile</div>
            <div class="game-sub">UC / Royale Pass</div>
        </div>
        <div class="game-card" onclick="openGame('standoff')">
            <div class="game-icon" style="background: linear-gradient(135deg, #8e2de2, #4a00e0);">🎯</div>
            <div class="game-title">Standoff 2</div>
            <div class="game-sub">Gold / Промокоды</div>
        </div>
        <div class="game-card" onclick="openGame('brawl')">
            <div class="game-icon" style="background: linear-gradient(135deg, #00c6ff, #0072ff);">⭐</div>
            <div class="game-title">Brawl Stars</div>
            <div class="game-sub">Гемы / Pass</div>
        </div>
    </div>

    <div class="modal" id="gameModal">
        <div class="modal-header">
            <h2 id="modalGameTitle">Free Fire</h2>
            <button class="btn-close" onclick="closeModal('gameModal')">✕</button>
        </div>
        <div class="form-group">
            <label class="form-label">Игровой ID (Player ID)</label>
            <input type="number" id="playerId" class="form-input" placeholder="Введите ваш ID в игре">
        </div>
        <label class="form-label">Выберите пакет доната:</label>
        <div class="packages-grid" id="packagesList"></div>
        <div class="form-group">
            <label class="form-label">Промокод</label>
            <div class="promo-box">
                <input type="text" id="promoCode" class="form-input" placeholder="Промокод">
                <button class="btn-promo" onclick="applyPromo()">OK</button>
            </div>
        </div>
        <div style="background: var(--card-bg); padding: 12px; border-radius:12px; margin-bottom:15px; font-size:14px;">
            Итого: <strong id="totalPrice" style="color:var(--green)">0 TJS</strong>
        </div>
        <button class="btn-primary" onclick="processOrder()">Оплатить заказ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let balance = 200.00, selectedPackage = null, selectedGameKey = '', discount = 0;
        const gameData = {
            freefire: { name: 'Free Fire', packages: [{ amount: '100 💎', price: 12 }, { amount: '210 💎', price: 24 }, { amount: '530 💎', price: 60 }] },
            pubg: { name: 'PUBG Mobile', packages: [{ amount: '60 UC', price: 11 }, { amount: '325 UC', price: 52 }, { amount: '660 UC', price: 105 }] },
            standoff: { name: 'Standoff 2', packages: [{ amount: '100 Gold', price: 15 }, { amount: '500 Gold', price: 75 }] },
            brawl: { name: 'Brawl Stars', packages: [{ amount: '30 Gems', price: 18 }, { amount: '80 Gems', price: 48 }] }
        };
        function openGame(key) {
            selectedGameKey = key; selectedPackage = null; discount = 0;
            const data = gameData[key];
            document.getElementById('modalGameTitle').innerText = data.name;
            document.getElementById('totalPrice').innerText = '0 TJS';
            const list = document.getElementById('packagesList');
            list.innerHTML = '';
            data.packages.forEach((pkg, idx) => {
                list.innerHTML += `<div class="pkg-item" id="pkg-${idx}" onclick="selectPkg(${idx})"><div class="pkg-amount">${pkg.amount}</div><div class="pkg-price">${pkg.price} TJS</div></div>`;
            });
            document.getElementById('gameModal').style.display = 'block';
        }
        function selectPkg(idx) {
            document.querySelectorAll('.pkg-item').forEach(el => el.classList.remove('selected'));
            document.getElementById(`pkg-${idx}`).classList.add('selected');
            selectedPackage = gameData[selectedGameKey].packages[idx];
            document.getElementById('totalPrice').innerText = (selectedPackage.price - discount) + ' TJS';
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function applyPromo() {
            if (document.getElementById('promoCode').value.trim().toUpperCase() === "TAJ2026") {
                discount = 5; tg.showAlert("Скидка 5 сомони применена!");
            } else { tg.showAlert("Неверный промокод"); }
        }
        function processOrder() {
            const id = document.getElementById('playerId').value;
            if (!id) { tg.showAlert('Введите ID!'); return; }
            if (!selectedPackage) { tg.showAlert('Выберите пакет!'); return; }
            tg.sendData(JSON.stringify({ game: gameData[selectedGameKey].name, playerId: id, package: selectedPackage.amount }));
            tg.close();
        }
        function copyCard() { navigator.clipboard.writeText('8888-1001'); tg.showAlert('Скопировано!'); }
        function showTopup() { tg.showAlert('Свяжитесь с администратором для пополнения!'); }
    </script>
</body>
</html>
